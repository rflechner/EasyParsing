name: Release to NuGet.org

run-name: Release EasyParsing ${{ inputs.version }} to NuGet.org

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID (optional; stable uses latest main, beta uses its commit)
        required: false
        type: string
      version:
        description: EasyParsing package version to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    name: Publish EasyParsing ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget-org

    concurrency:
      group: nuget-org-release
      cancel-in-progress: false

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Resolve package workflow run
      id: package-run
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ inputs.run_id }}
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$PACKAGE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
          echo "::error::Invalid package version: $PACKAGE_VERSION"
          exit 1
        fi

        if [[ -z "$RUN_ID" ]]; then
          BUILD_BRANCH=main
          COMMIT_FILTER=()
          if [[ "$PACKAGE_VERSION" =~ -beta-([0-9a-f]{7,40})$ ]]; then
            BUILD_BRANCH=develop
            COMMIT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/${BASH_REMATCH[1]}" --jq '.sha')"
            COMMIT_FILTER=(--commit "$COMMIT_SHA")
          elif [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "::error::Provide run_id for prerelease versions outside the beta-<commit> naming convention."
            exit 1
          fi

          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow dotnet.yml \
            --branch "$BUILD_BRANCH" \
            "${COMMIT_FILTER[@]}" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "::error::No successful dotnet.yml push run found on $BUILD_BRANCH for $PACKAGE_VERSION. Provide run_id to select a specific build."
            exit 1
          fi
        fi

        if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::Workflow run ID must be a positive integer."
          exit 1
        fi

        ARTIFACT_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
          --paginate --jq '[.artifacts[] | select(.name == "easyparsing-nuget" and .expired == false)] | length')"
        if ! [[ "$ARTIFACT_COUNT" =~ [1-9] ]]; then
          echo "::error::Run $RUN_ID has no available easyparsing-nuget artifact. Choose a build that saved the requested package, or rebuild the source commit with artifact upload enabled."
          exit 1
        fi

        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "Using package from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

    - name: Download tested NuGet package
      uses: actions/download-artifact@v4
      with:
        name: easyparsing-nuget
        path: artifacts
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.package-run.outputs.run_id }}

    - name: Validate selected package
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$PACKAGE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
          echo "Invalid package version: $PACKAGE_VERSION"
          exit 1
        fi

        for EXTENSION in nupkg snupkg; do
          if [[ ! -f "artifacts/EasyParsing.$PACKAGE_VERSION.$EXTENSION" ]]; then
            echo "::error::Run ${{ steps.package-run.outputs.run_id }} does not contain EasyParsing.$PACKAGE_VERSION.$EXTENSION. Select the run_id matching the requested version."
            echo "Downloaded packages:"
            find artifacts -maxdepth 1 -type f -print
            exit 1
          fi
        done

    - name: Authenticate to NuGet.org
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish NuGet package
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        PACKAGE_VERSION: ${{ inputs.version }}
      run: >
        dotnet nuget push "artifacts/EasyParsing.$PACKAGE_VERSION.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "$NUGET_API_KEY"
        --skip-duplicate

    - name: Publish NuGet symbols
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        PACKAGE_VERSION: ${{ inputs.version }}
      run: >
        dotnet nuget push "artifacts/EasyParsing.$PACKAGE_VERSION.snupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "$NUGET_API_KEY"
        --skip-duplicate
